  sin6_hollow:
    enabled: true
    temperature_override: 0.7
    domain_focus: "Deception, misdirection, false flag operations, camouflage"

# ── Boardroom Tuning ──────────────────────────────────────────
boardroom:
  default_rounds: 2
  chairman_model: "gemini"
  boardroom_model: "claude"
  max_argument_length: 250
  verdict_styles: ["go", "no-go", "conditional"]

# ── Scout / Crawler Tuning ────────────────────────────────────
scouts:
  firefly_scan_interval_minutes: 15
  web_crawler_user_agent: "Syntax-Intelligence/1.0"
  max_crawl_depth: 3
  trend_detection_window_hours: 24
  emergent_signal_threshold: 0.7

# ── Bardildo Tuning ──────────────────────────────────────────
bardildo:
  tone: "maximum_snark"
  scan_skip_dirs: [".git", "node_modules", "__pycache__", "venv", ".venv"]
  max_readme_chars: 2000
  buddy_personas: ["askhole", "dustbunny", "summarizer", "archivist", "qa"]

# ── TruthSleuth Tuning ───────────────────────────────────────
truthsleuth:
  monitor_interval_seconds: 10
  max_function_complexity: 10
  max_line_length: 100
  forbidden_patterns: ["eval(", "exec(", "__import__(", "compile("]
  min_docstring_length: 20

# ── NME Battle Rapper Tuning ──────────────────────────────────
nme:
  style: "ruthless_freestyle"
  bar_length_lines: 4
  rhyme_scheme: "AABB"
  max_bars_per_response: 16
  allowed_topics: ["code_quality", "architecture", "tech_stack", "competitors", "the_industry"]
  burn_intensity: 0.95

# ── Sin6 Native Agent Tuning ──────────────────────────────────
sin6:
  wraith_stealth_level: 0.9
  oracle_prediction_horizon_hours: 72
  forge_output_types: ["script", "tool", "exploit", "patch"]
  weaver_narrative_style: "disinformation_resistant"
  harvest_extraction_depth: "deep"
  hollow_camouflage_quality: "military_grade"
